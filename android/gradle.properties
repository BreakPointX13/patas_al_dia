org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Acelera builds repetidos sin pedir más RAM (a diferencia de
# org.gradle.parallel, que sí la pediría — contraproducente en esta máquina,
# ver decisiones_arquitectura.md). org.gradle.configuration-cache se probó
# también, pero se sacó de nuevo el mismo día: rompe el build (el task
# interno de Flutter DebugMinSdkCheck usa tipos que la configuration cache
# de Gradle 9 no puede serializar — incompatibilidad conocida, no algo para
# arreglar en este proyecto).
org.gradle.caching=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# El propio plugin de Flutter (FlutterPlugin.kt) fuerza isMinifyEnabled +
# isShrinkResources = true en el build de release por defecto, sin importar
# lo que se ponga en android/app/build.gradle.kts — esta es la única
# propiedad que ese plugin realmente respeta para desactivarlo.
shrink=false
# La causa real del ícono roto en release NO era el shrinker (shrink=false
# arriba no alcanzó por sí solo, confirmado con unzip -l sobre el .apk: TODOS
# los recursos seguían apareciendo con nombres cortos tipo res/-8.xml).
# Es una optimización aparte de AAPT2 que acorta los nombres de archivo de
# TODOS los recursos en release para bajar el tamaño del APK, independiente
# de minifyEnabled/shrinkResources. flutter_local_notifications busca el
# ícono por String en tiempo de ejecución (ver notificacion_service.dart) y
# con el nombre acortado esa búsqueda falla — la app quedaba pegada en el
# splash nativo, crasheando en main() antes de runApp(). Ver
# decisiones_arquitectura.md.
android.enableResourceOptimizations=false
